<script>const episodes=[{"id": "01", "phase": "看见结构", "label": "反馈与行动", "title": "为什么我们越努力解决问题，问题反而越严重？", "subtitle": "善意的行动如何变成不断自我强化的困境", "concepts": ["强化反馈", "系统结构", "治标与治本"], "minutes": 6, "body": "也许你见过这样的办公室。项目延期了，大家都很着急。负责人说，现在不是讨论原因的时候，先把进度赶上来。于是会议增加了，日报细化了，晚上九点以后仍然有人在工位上。最初的一周，数字确实好看了一些。可是随后，返工开始增多，沟通开始迟滞，重要的问题被藏进一句“明天再说”里。为了追回新的损失，所有人又被要求再努力一点。\n\n这不是在描写某一家真实公司，而是一个用来思考的假想场景。它令人不安的地方在于：即使每个人都真心希望项目顺利，最后仍然可能把局面推向反面。\n\n我们习惯于把故事解释成一个人的性格：老板太急躁，员工不负责，项目经理不会管理。但如果把人换一批，考核和激励没有改变，信息仍然滞后，返工仍然只计作“新的任务”，那么相似的结局可能再次发生。\n\n## 一件事为什么会反过来推动自己\n\n《系统之美》提醒我们：观察一个事件，只能看见某个时刻发生了什么；观察一段时间里的行为，才可能开始辨认制造这些行为的结构。\n\n在刚才的例子里，有一条可能的循环：进度落后，让管理者加强催促；催促让工作时间延长；过度疲惫增加错误；错误产生返工；返工又让进度更加落后。这个循环并不是谁特别邪恶才会发生。各个环节甚至都有看似合理的理由。\n\n系统思维把“某种变化使同方向的变化继续增强”的结构称为强化反馈。请注意，强化并不意味着一定越来越好。储蓄利息滚入本金可能形成增长；恐慌与挤兑也可能让下降进一步加速。\n\n但真实世界很少只存在一条回路。长时间工作也许暂时能提高产出，团队也可能通过改进协作打破返工，客户需求可能在中途变化。我们的故事是一个帮助发现机制的简化模型，不是对所有加班团队的诊断结论。\n\n## 为什么眼前的办法如此诱人\n\n当一个问题正在燃烧，眼前最容易拿到的办法往往是增加投入。人手不够就加人，时间不够就加班，审核出错就增加一道审批。因为它们非常“可见”：今天要求加班，明天就能看到工作时长上升；今天加一道审批，明天就能看见多了一张签字单。\n\n但是系统的结果往往来得更慢。疲劳怎样影响判断，审批怎样延长等待，新增的人手怎样增加沟通成本，这些变化并不一定会立刻出现在报表里。短期收益比长期代价更早被看见，而人的注意力天然偏向眼前。\n\n这不意味着加班、招聘和审核毫无价值。有截止期限的危机里，临时增加资源可能完全合理。关键在于：我们是否知道自己是在临时救火，还是正把救火的动作固化成日常制度？\n\n更危险的是，救火取得的短期成绩可能证明“方法有效”，让组织拒绝追问火源究竟在哪里。\n\n## 把目光从人移向关系\n\n系统思维最重要的转换，也许不是让我们学会一种新术语，而是把提问方式稍稍改变。\n\n面对质量事故，我们当然需要调查责任；但调查之外还可以追问：谁最早发现了异常？他为什么没有报告？报告给谁？什么样的考核会奖励掩盖问题？哪些信息在部门交接时丢失？一个人明明知道某件事不对，却为何觉得说出来比沉默更危险？\n\n当这些问题浮现，我们看到的就不再是简单的“好员工”和“坏员工”，而是一张由信息、奖惩、时间压力和彼此预期组成的关系网。\n\n当然，结构解释不能成为个人免责的借口。如果有人故意隐瞒危险，仍然需要承担责任。只是如果我们只处罚一个人，却保留鼓励隐瞒的制度，下一个人可能面临完全相同的诱惑。\n\n理解结构，是为了让责任不止停留在最后一个被看见的人身上。\n\n## 一张迟到的成绩单\n\n想象另一种情景：某个团队每周公布“完成任务数”，却不统计返工率和上线之后的客户抱怨。努力的人会尽量把一项大任务拆成更多小任务，让完成数字上升。会议上掌声很多，用户却越来越不满意。\n\n现在我们可以把问题问得更深一点：这个团队真正追求的是什么？是数量，还是稳定交付的价值？如果只有数量被不断反馈到团队，大家就会越来越擅长创造数量。信息不是中性的镜子，它也会改变行为。\n\n我们可以先做一个很小的实验：一段时间内，同时记录完成数量、返工成本、用户结果，并让实际执行者参与解释这些数字。改变信息流，可能比再加一次会议更能帮助团队找到原因。\n\n但也必须谨慎。新增指标也可能被游戏化，观察到相关性也不等于已经证实了因果。真正严肃的改变，需要假设、观察、反例和修正。\n\n## 从今天开始，练习另一种提问\n\n下次遇到一个反复出现的问题，我们可以先不问“为什么又有人犯错了”，而是问：这个问题过去三个月呈现什么趋势？每次发生以后，我们采取什么行动？这些行动会不会反过来影响下一次发生的概率？系统究竟在奖励什么，又在惩罚什么？\n\n这几个问题不一定立刻帮我们找到答案，却可能把我们带离最熟悉、也最容易重复的解释。\n\n读《系统之美》，不是为了学会站在局外批评别人缺乏系统思维。因为我们自己也总是系统的一部分：我们的催促、抱怨、沉默、好意和焦虑，也正在改变其他人的行为。\n\n如果今天只留下一个问题，我希望是这个：**我现在最努力推动的那件事，会不会正在悄悄制造它想消灭的问题？**", "wordCount": 1942}, {"id": "02", "phase": "看见结构", "label": "存量与延迟", "title": "为什么我们总在问题爆发后，才发现早有征兆？", "subtitle": "一切突然发生的事情，也许都在缓慢积累", "concepts": ["存量与流量", "时间延迟", "临界点"], "minutes": 5, "body": "一个人突然说自己累得不想工作了。旁人很惊讶：上个星期不是还好好的吗？但如果我们能沿着时间往回看，就可能看见那些并不起眼的晚上：睡眠减少一点，耐心减少一点，恢复的时间减少一点。直到某一天，一件很小的事情成为最后一根稻草。\n\n我们总喜欢给变化寻找那个“决定性的瞬间”。可许多瞬间，只不过是长期累积第一次变得无法忽视。\n\n## 浴缸里装的不是今天的水\n\n梅多斯在《系统之美》中用浴缸解释一个简单却极容易忘记的事实：水位由过去累积的入水与出水决定，而不只是此刻水龙头开得有多大。水龙头关小，并不代表浴缸里的水立刻下降；只要入水仍然大于出水，水位还会上升，只是升得慢一些。\n\n这个道理放到生活里，会改变很多直觉。存款是存量，收入与支出是流量。待处理的工作是存量，新需求和已完成任务是流量。身体疲劳可以作为一种不完全精确的类比：消耗与恢复长期不平衡，就可能形成越来越难忽视的负担。\n\n当我们说“增长已经放缓，为什么压力还在增加”，也许是因为我们把流量的变化误认为存量已经逆转。增长速度下降，与总量下降，是两件不同的事情。\n\n## 延迟怎样让聪明人反复犯错\n\n想象一间餐馆：午餐时段出现缺货，老板决定多进货。然而新货要三天后才到。在等待期间，他看见货架依然空着，又下了一次订单。第三天与第四天，几批货接连到达，库存突然过剩。为了减少损失，他停止采购；若干天后，库存再次紧张。\n\n老板未必不聪明。他只是试图根据已经过时的信息，调整一个有延迟的系统。行动与结果之间存在时间差，使过度修正成为可能。\n\n许多个人计划也有相似的结构。锻炼一个星期没看到体能明显改善，就突然增加运动量；学习几天没有明显进步，就不停更换方法。问题不一定是努力不够，而可能是反馈来得比我们希望的晚。\n\n## 预测不是寻找一个神奇的日期\n\n系统思维并不承诺我们能够准确知道哪一天会发生危机。它教我们分辨：哪些变量是缓慢累积的，哪些行动会有明显延迟，哪些看似稳定的现象其实正在接近约束。\n\n如果要观察一个复杂系统，最好不要只盯当天的结果。也可以记录更早的信号：待办积压速度、恢复时间、投诉重复率、实际可用的缓冲余量。\n\n但这些信号需要结合实际情境解释。积压变多，可能因为效率下降，也可能因为需求突然增长；没有足够证据时，不应把单一指标直接当成因果证明。\n\n真正值得留在心里的问题是：**我现在看见的平静，是一种稳定，还是一种尚未显露后果的积累？**", "wordCount": 968}, {"id": "03", "phase": "看见结构", "label": "有限理性", "title": "为什么每个人都做了理性的选择，最后却得到荒谬的结果？", "subtitle": "局部的正确，未必能拼成整体的正确", "concepts": ["有限理性", "局部最优", "公共资源"], "minutes": 5, "body": "城市早高峰的路上，每一个司机都希望尽快到达目的地。为了节省时间，有人选择最短的路，有人临时变道，有人看见隔壁车道动了一点，就马上并过去。从个人的视角看，这些动作都有理由；从整条道路看，频繁的扰动却可能让通行效率更差。\n\n这并不是说道路拥堵完全由个人变道造成。交通流量、道路设计、信号灯和事故都有影响。这个场景只是提醒我们：当许多人同时根据局部信息行动，整体结果未必符合任何一个人的愿望。\n\n## 理性总有边界\n\n《系统之美》讨论的有限理性，不是说人类普遍愚笨，而是说每个人做决定时都处在自己的边界里。我们能看到的信息有限，受制于眼前的规则、时间和压力，也有自己的目标。\n\n一位销售为了达成当月指标，可能承诺交付团队无法兑现的工期。销售的奖金因此增加，订单也顺利签下；但交付部门承担了返工和客户抱怨。站在销售岗位上，这个行动可能符合现有激励；站在公司的长期利益上，却可能是坏选择。\n\n把矛头只指向销售个人，容易忽略一个问题：如果组织只奖励签单而不反馈交付质量，那么它到底在引导什么行为？\n\n## 公共资源为什么容易被过度使用\n\n一片公共草地，每个牧民多放一只羊都可以增加自己的收益，但草地承受的损害却由所有人共同承担。这样的问题常被用来说明公共资源困境：对单个人有利的追加使用，可能让共同资源逐步退化。\n\n不过，现实中的公共资源并不注定要毁灭。社区可以制定共同规则、监督使用、协商分配。制度设计以及参与者之间的信任，会显著改变结果。\n\n因此，系统思维不是一句“人性自私”就能解释世界。它要求我们继续看：资源的边界是什么？谁掌握信息？谁承担代价？有没有共同决策与纠偏的途径？\n\n## 更好的提问方式\n\n当一个团队人人都在尽责却仍然失控时，我们不妨同时画出每个角色的目标：员工希望少犯错，主管希望指标好看，产品希望快速上线，客户希望稳定可靠。然后再问：他们是否在看同一张成绩单？他们是否有权决定影响自己的规则？\n\n一个更好的系统，未必需要所有人突然变得高尚，而可能需要让更广泛的后果进入每个人的视野。\n\n这也给我们留下一个难题：**如果我只是把自己分内的事情做到最好，是否就足以说我对整体结果尽了责任？**", "wordCount": 871}, {"id": "04", "phase": "理解困境", "label": "目标与指标", "title": "为什么规则越完善，人们反而越擅长钻空子？", "subtitle": "当数字从观察工具变成比赛目标", "concepts": ["目标错位", "规则规避", "指标游戏化"], "minutes": 5, "body": "一个学校希望提高教学质量，于是开始公布考试排名。排名当然能提供信息，但它也可能悄悄改变教学本身。教师增加应试训练，学生变得更熟悉题型，学校的平均成绩提高了。可是如果我们追问：孩子是否更愿意提问、更能理解复杂问题、更有探索的勇气？答案未必同步提高。\n\n数字没有说谎，只是它测量的东西比我们真正关心的事情更窄。\n\n## 指标与目标的距离\n\n在现实世界中，我们无法直接测量所有重要的东西。公司用销售额评估经营，医院统计就诊量，学校记录考试成绩，互联网产品关注点击和转化。这些指标都可能很有用。\n\n但当指标被拿来分配奖金、决定晋升、评价成败时，人们会调整行为去适应它。原本只是描述现实的数字，开始参与塑造现实。\n\n《系统之美》提醒我们关注一个系统真正运行的目标。系统口头宣称的目标，未必等于它通过奖惩和资源配置实际追求的目标。如果一家机构反复强调质量，却只在数量下降时处罚员工，那么它表达了两套互相冲突的信号。\n\n## 为什么增加规则未必能解决\n\n管理者发现有人利用指标，就增加一道检查；出现新的漏洞，又补一份流程。短期内，漏洞可能缩小。但每一条新增规则也会带来学习成本、等待时间和新的规避空间。\n\n这里不能简单得出“规则越少越好”。在食品安全、财务合规等领域，严密规则能够保护许多人。关键问题是：规则是否指向真正的风险？结果有没有被观察？被管理者是否有机会提出反馈？\n\n如果评价体系只允许一个数字代表全部价值，参与者总能找到围绕这个数字优化的方法。把数字当成地图没有问题，危险发生在我们忘记：地图不是地形。\n\n## 如何保留指标的价值\n\n可以尝试同时观察结果、质量和代价。例如，不只看完成量，也看返工率与客户感受；不只看短期转化，也看长期留存与投诉。与此同时，保留现场访谈，让数字与具体经历互相校正。\n\n但指标越多不意味着越好。过多数字也可能使注意力碎片化，掩盖真实责任。合理的做法是让指标服务于问题，而非让问题被迫适应指标。\n\n这一期最后想问的是：**当我努力让一个数字变得更漂亮时，我究竟在改善现实，还是在改善现实的画像？**", "wordCount": 833}, {"id": "05", "phase": "理解困境", "label": "转移负担", "title": "为什么有些解决办法，最后会让我们越来越依赖它？", "subtitle": "暂时的止痛，也可能使我们失去修复能力", "concepts": ["转移负担", "短期反馈", "依赖结构"], "minutes": 5, "body": "一个部门遇到系统故障，最熟悉业务的工程师立刻赶来，手动修复数据。故障结束，大家松了一口气。下一次出问题，大家还是找他；再下一次，仍然如此。\n\n久而久之，这名工程师成了团队离不开的人。可令人奇怪的是，团队处理故障的整体能力并没有随之提高，反而越来越依赖他的个人经验。\n\n## 救火本身并没有错\n\n发生事故时，让有能力的人迅速处理，是完全合理的选择。问题不是“要不要救火”，而是救火之后有没有修复让火灾反复发生的结构。\n\n梅多斯讨论过一种常见的系统陷阱：人们把注意力放在可以快速缓解症状的方案上，反而削弱了从根本上解决问题的能力。我们可以把它理解为“转移负担”：眼前的痛苦减轻了，建立长期能力的动力也一并减弱。\n\n对于刚才的工程团队，真正的修复也许不是禁止专家介入，而是让事故记录可追踪、知识被共享、重复故障被归类、测试和监控得到改进。下一次问题发生时，团队能否比上一次更独立地处理？\n\n## 对短期见效保持敬意，也保持警惕\n\n生活里也有类似的情景。工作太忙，习惯用咖啡抵抗睡意；学不进去，不断购买新的课程；关系紧张，靠暂时的回避保持表面平静。这些举动未必错误，更不必被道德化。\n\n真正值得追问的是：这个办法解决的是眼前的不适，还是导致不适的机制？它有没有副作用？使用得越久，我们自身的应对能力是增强了还是减弱了？\n\n有些长期问题当然不能仅靠个人意志解决。睡眠不足可能与工作制度相关，团队故障可能是技术债和人员投入共同造成的。系统思维之所以重要，恰恰是帮助我们看到不应只让个人承担全部成本。\n\n## 两张账本\n\n可以尝试给每一种“救火方案”同时记两张账。第一张记录它今天解决了什么，第二张记录它一年后让我们拥有或失去了什么能力。\n\n增加审批可能降低一次事故风险，却也可能拖慢信息流；邀请专家救援可能让服务恢复，却也可能遮蔽制度缺陷。两张账都是真的，我们需要在时间尺度之间做选择。\n\n本期的问题是：**我现在最离不开的那个解决办法，是在增强我的能力，还是在替代我的能力？**", "wordCount": 805}, {"id": "06", "phase": "理解困境", "label": "竞争升级", "title": "为什么好的竞争，最后常常演变成所有人的消耗？", "subtitle": "当每一次自保，都成为对方继续升级的理由", "concepts": ["强化回路", "竞争升级", "协作规则"], "minutes": 5, "body": "两个相邻的商店决定延长营业时间。一家开到晚上十点，另一家便延长到十一点。为了留住顾客，第一家又延长到午夜。几个月后，两家都没有明显增加利润，店员却更疲惫，运营成本也更高。\n\n故事中的商家不一定真的会这样行动，它只是展示一种可能的结构：当双方不断以超过对手为目标，竞争就可能形成自我强化的循环。\n\n## 我不得不这样做\n\n竞争升级的吊诡之处在于，每次行动都能找到防御性的理由。你降价，我不能不跟；你提高投放，我只好追加预算；你延长在线时间，我不能显得不够勤奋。\n\n于是，双方都觉得自己在被迫应对。没有人想走到最终局面，可每一步都认为“不这么做会更糟”。\n\n这类结构在《系统之美》的系统陷阱讨论中有对应：一方试图超过另一方的行为会刺激对方继续追赶。结果并不总是坏的；某些创新竞赛也能带来技术进步。但当竞争主要增加的是相互消耗，双方可能投入越来越多，却离各自真正希望获得的生活与经营目标越来越远。\n\n## 为什么停下来反而困难\n\n假设某个员工决定不再下班后回复非紧急消息。他可能担心同事仍在回复，自己因此显得不够投入。此时，问题已不只是个人时间管理，而涉及评价制度、同事预期和组织文化。\n\n单独劝一个人“学会拒绝”，不一定足够。更稳妥的改变，可能是团队共同确定非紧急消息的响应规则、明确工作目标，并让管理层以实际行为遵守。\n\n在更广阔的社会中，竞争是否能够形成合作，也依赖法律、信任、信息透明度与共同约束。系统思维不能代替伦理和政治讨论，但能帮助我们理解为什么只靠个体克制，有时难以跳出困局。\n\n## 换掉比赛的计分方式\n\n真正深刻的改变，可能不是继续寻找一个更有效的竞争技巧，而是重新定义“赢”的含义。如果商店的目标从营业时长改为可持续利润与顾客满意度，可能会采取完全不同的策略。\n\n同样，一个人在工作中把“比所有人都忙”当成胜利，就难以从忙碌里退出；若把目标改为长期创造可靠的成果，便有机会质疑那些只为显得努力而存在的活动。\n\n留下的问题是：**我所参与的竞争，究竟把我带向自己想要的生活，还是只让我不敢比别人慢下来？**", "wordCount": 831}, {"id": "07", "phase": "寻找改变", "label": "杠杆点", "title": "如果只能改变一件事，究竟应该改变什么？", "subtitle": "有时最重要的变量，并不是最容易看到的数字", "concepts": ["杠杆点", "信息流", "规则与目标"], "minutes": 5, "body": "一家企业希望减少客服投诉。最直接的办法是增加客服人数，要求回复更快。这个办法可能有效，但过了一段时间，投诉量又上升了。\n\n有人提出另一个问题：为什么这些投诉会不断产生？调查后发现，订单页面有一段容易误解的说明，导致许多用户选择错误服务。修改说明、增加下单前的提醒，也许比单纯增加客服更有效。\n\n这个故事不是说界面优化一定优于招聘，而是在说明一个系统里的不同干预位置，可能产生完全不同的影响。\n\n## 为什么我们总喜欢调数字\n\n在管理工作中，我们很容易动那些看得见的参数：预算多一点，人手多一点，考核分数高一点，标准线降低一点。这些参数当然重要，有时甚至决定系统能不能安全运转。\n\n但梅多斯对“杠杆点”的讨论提醒我们，系统里还有一些更深的介入位置：信息怎样流动，规则怎样制定，参与者有没有自我组织的能力，组织真正追求什么目标，又是依据什么世界观设计这些规则。\n\n这份排序不是万能公式。梅多斯本人也强调，它不是操作手册，而是打开思路的邀请。一个地方看似高杠杆，放到具体场景里未必最容易、最安全、最值得改变。\n\n## 信息可能比命令更有力量\n\n想象司机为了赶进度总在某个路口绕行。管理者可以不断要求司机准时，也可以调查：司机是否掌握实时道路信息？系统推荐路线是否准确？等待时间有没有被纳入计划？\n\n让正确的信息在正确时间抵达需要它的人，有时比增加一道命令更能改善结果。\n\n但信息公开不是唯一答案。即使知道问题，员工也可能缺少改变规则的权限；即使规则合理，执行成本也可能过高。因此，信息、权力、资源和激励往往要放在一起看。\n\n## 改目标可能比改速度更难\n\n一个产品团队不断优化点击率，却发现用户越来越不满意。或许问题不在按钮颜色，而在它究竟把什么当作成功。\n\n如果产品真正希望帮助用户完成任务，目标就可能从“更多点击”转向“更少步骤完成正确选择”。然而新目标同样需要警惕：更少步骤也不总等于更好的理解与决策。\n\n没有任何指标能永久替代判断，我们只能不断从真实结果中学习。\n\n这一期的问题是：**我准备改变的，是系统里最显眼的地方，还是最可能改变长期行为的地方？**", "wordCount": 846}, {"id": "08", "phase": "寻找改变", "label": "与复杂共处", "title": "当世界复杂到无法掌控，我们该如何生活？", "subtitle": "成熟的系统思维，最终也许是一种谦逊", "concepts": ["韧性", "不确定性", "持续学习"], "minutes": 5, "body": "如果你是一名程序员，可能会熟悉这样的期待：只要我们收集更多日志，建立更好的模型，补齐更多测试，系统就能越来越可控。\n\n这是一种宝贵的工程精神。但复杂系统也会不断提醒我们：每一项改动都可能遇见没有预计到的环境，每一个模型都只描绘了现实的一部分。\n\n于是，一个难题出现了：承认无法彻底掌控，是否意味着我们应该停止计划、停止行动？\n\n## 模型不是世界本身\n\n《系统之美》之所以动人，不只是因为它介绍了反馈、存量和杠杆点。书到最后，真正触及的是我们面对复杂性时的态度。\n\n我们需要模型，才能把纷乱的现象暂时组织起来；我们也需要知道模型的边界，才能在现实反驳它时及时修改。\n\n用一张系统图解释家庭关系、公司管理或社会问题，常常很有启发。但当图中的箭头把人变成毫无感情的变量时，我们也可能丢掉那些最重要的部分：尊严、权力、历史、情感与不可替代的个人经历。\n\n系统思维是一种观察方式，不是凌驾于其他理解方式之上的终极语言。\n\n## 从控制转向学习\n\n假如我们要设计一个更稳健的团队，不一定能预测它未来遇到的每一个问题。但我们可以建立透明反馈，减少错误信息的传播，保留必要缓冲，让一线成员有机会报告真实问题，并允许低成本试验。\n\n这些措施不保证永不失败，却可能让组织在失败之后更容易恢复。韧性并不是硬到无法弯曲，而是受到冲击后仍然有调整和继续生活的能力。\n\n放到个人生活，韧性也不等同于把每个小时都安排得严丝合缝。留给自己休息与探索的空间，承认自己的判断会错，减少对单一计划的依赖，这些看起来“不够高效”的安排，也许恰好让长期生活更稳定。\n\n## 在世界里，而不是在世界上方\n\n有时候我们阅读一本书，会期待它提供一把钥匙，从此可以打开所有困惑。读《系统之美》之后，也许反而应该少一点这种自信。\n\n我们看到更多相互影响的关系，知道善意可能产生坏结果，也知道改变一个参数不等于改变整个结构。于是，我们更慎重地责怪别人，也更谨慎地相信自己的方案。\n\n可这不是悲观。它意味着真正成熟的行动可以从一个较小的姿态开始：先观察，再提出假设；先聆听系统中的人，再动手改变；行动以后持续看反馈，必要时承认自己错了。\n\n世界不一定因为我们掌握某种理论就变得简单，但我们可以因此变得更愿意理解它。\n\n「借书之问」这部作品想留下的最后一个问题是：**当我不能控制所有结果时，我是否依然愿意认真负责地行动，并且保持修正自己的勇气？**", "wordCount": 960}];

function renderSide(){ $('sidebar-episodes').innerHTML=episodes.map(e=>`<button class="navlink ${current===e.id?'active':''}" onclick="goRead('${e.id}')"><span class="num">${e.id}</span><span>${esc(e.title)}</span>${completed.has(e.id)?'<span class="mini-check">✓</span>':''}</button>`).join('');$('progress-text').textContent=`${completed.size} / 8 已完成`;$('progress-fill').style.width=(completed.size/8*100)+'%';document.querySelector('[data-nav="home"]').classList.toggle('active',current==='home')}
function cards(list){return list.length?list.map(e=>`<article class="episode-card" tabindex="0" role="link" onclick="goRead('${e.id}')" onkeydown="if(event.key==='Enter')goRead('${e.id}')"><div class="episode-card-top"><span class="index">${e.id}</span><span>${esc(e.phase)}　·　约 ${e.minutes} 分钟</span></div><h3>${esc(e.title)}</h3><p>${esc(e.subtitle)}</p><div class="episode-card-footer"><span>${esc(e.label)}</span><span>${completed.has(e.id)?'✓ 已读':'阅读本期 →'}</span></div></article>`).join(''):'<div class="empty">没有找到相关内容，试试“反馈”“规则”或“目标”。</div>'}
function renderHome(){ $('main').innerHTML=`<div class="hero"><div class="inner"><div class="eyebrow">借书之问 / VOL. 02 / 思想主题阅读</div><h1>系统之<em>美</em></h1><p>为什么我们越努力解决问题，<br>问题反而越复杂？</p><div class="hero-graphic" aria-hidden="true"><div class="circle one"></div><div class="circle two"></div><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span><span class="tinytag tag1">行动</span><span class="tinytag tag2">反馈</span><span class="tinytag tag3">改变</span></div><p style="font:14px/1.95 var(--sans);max-width:590px">借德内拉·梅多斯的《系统之美》，重新理解工作、规则、竞争与生活。不是复述一本书，而是围绕八个值得追问的问题，展开八次独立的思想旅行。</p><div class="hero-actions"><button class="btn" onclick="goRead('${firstUnread()}')">开始阅读 <span>↗</span></button><button class="btn outline" onclick="document.getElementById('chapter-list').scrollIntoView({behavior:'smooth'})">浏览八期目录 ↓</button></div><div class="stats"><div class="stat"><strong>08</strong><span>次思想旅程</span></div><div class="stat"><strong>03</strong><span>个讨论阶段</span></div><div class="stat"><strong>${episodes.reduce((a,e)=>a+e.minutes,0)}</strong><span>分钟预计阅读</span></div></div></div></div>
<div class="inner"><section class="section" id="chapter-list"><div class="section-kicker">THE QUESTIONS</div><h2>八个问题，一种新的观察方式</h2><p class="section-intro">从“为什么会这样”，走向“是什么结构使它反复发生”。每一期都可以独立阅读，也可以从头跟随这条思想路线。</p><div class="phases"><span class="pill">01–03　重新理解问题</span><span class="pill">04–06　看见系统陷阱</span><span class="pill">07–08　寻找改变与共处</span></div><input id="q" class="searchbox" placeholder="⌕　搜索主题：反馈、制度、竞争、生活……" oninput="searchEpisodes(this.value)" aria-label="搜索文章"><div id="episode-grid" class="episode-grid" style="margin-top:22px">${cards(episodes)}</div></section><div class="statement"><span class="eyebrow">A THOUGHT TO KEEP</span><blockquote>当一件不合理的事反复出现时，除了问“是谁做错了”，我们还能不能多问一句：<strong>是什么让它不断发生？</strong></blockquote><p>这是我们的思考线索，不是对原著的直接引用。</p></div><section class="section" style="padding-top:8px"><div class="section-kicker">ABOUT THE SERIES</div><h2>不是一本书的摘要</h2><p class="section-intro" style="max-width:810px;line-height:2">「借书之问」是一种问题导向的阅读：从一本书里提炼值得讨论的矛盾，再借助故事、历史与现实观察，追问背后的结构。文中案例包含虚构的说明性场景，并非原书叙事或真实事件的证据。希望我们既认真理解作者，也能保留质疑作者与修正自己判断的空间。</p></section><footer class="footer">原创主题讲述 · 以《系统之美》（Donella H. Meadows, <i>Thinking in Systems</i>）为思想线索。<br>延伸阅读：<a target="_blank" rel="noopener" href="https://www.penguinrandomhouse.com/books/801035/thinking-in-systems-by-donella-meadows/">图书出版信息</a> · <a target="_blank" rel="noopener" href="https://donellameadows.org/archives/leverage-points-places-to-intervene-in-a-system/">梅多斯关于杠杆点的文章</a><br>© 借书之问 · 原创独立评论，不替代阅读原著。</footer></div>`; $('top-progress').style.width='0';document.title='借书之问 · 系统之美';}
function firstUnread(){return (episodes.find(e=>!completed.has(e.id))||episodes[0]).id}
function searchEpisodes(q){let s=q.toLowerCase().trim();$('episode-grid').innerHTML=cards(episodes.filter(e=>!s||[e.title,e.subtitle,e.phase,e.label,...e.concepts,e.body].some(t=>t.toLowerCase().includes(s))))}
function inline(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}
function formatBody(raw){return raw.split(/\n\n+/).map(t=>t.startsWith('## ')?'<h2>'+inline(t.slice(3))+'</h2>':'<p>'+inline(t)+'</p>').join('')}
function renderRead(id){let e=episodes.find(x=>x.id===id);if(!e){goHome();return}let pos=episodes.findIndex(x=>x.id===id), next=episodes[pos+1];$('main').innerHTML=`<div class="reader"><button class="backlink" onclick="goHome()">← 返回系列目录</button><div class="reader-kicker">借书之问　/　系统之美　/　EP.${e.id}</div><h1>${esc(e.title)}</h1><p class="lead">${esc(e.subtitle)}</p><div class="readmeta"><span>作者视角：借书之问</span><span>·</span><span>约 ${e.minutes} 分钟阅读</span><span>·</span><span>${e.wordCount} 字</span><span>·</span><span>${esc(e.concepts.join(' · '))}</span></div><div class="read-toolbar"><button onclick="changeFont(-1)" aria-label="减小字号">A−</button><button onclick="changeFont(1)" aria-label="增大字号">A＋</button><button onclick="toggleTheme()">◐ 日夜模式</button><button onclick="copyLink()">↗ 分享链接</button></div><article class="article" id="article">${formatBody(e.body)}</article><div class="reflection"><div class="reader-kicker">WRITE YOUR ANSWER</div><h3>把问题留给自己</h3><p>阅读到这里，有没有想起工作或生活中的某个场景？你的思考会自动保存在这台设备的浏览器中。</p><textarea id="note" placeholder="记下自己的疑问、经历、反例，或者一个暂时没有答案的想法……"></textarea><div class="small" id="save-label" style="margin-top:8px">私密笔记 · 仅存此浏览器</div></div><div class="reader-end"><button class="btn outline" id="complete-btn" onclick="markDone('${e.id}')">${completed.has(e.id)?'✓ 已完成 · 取消标记':'✓ 标记已读'}</button>${next?`<button class="btn" onclick="goRead('${next.id}')">阅读下一期 →</button>`:`<button class="btn" onclick="goHome()">返回全部目录 ↗</button>`}</div><div class="closing">本文是围绕原著展开的原创评论与思考，示例场景不等同于原著案例。概念及观点应结合原书和实际证据检验。<br>基础参考：<a href="https://www.penguinrandomhouse.com/books/801035/thinking-in-systems-by-donella-meadows/" target="_blank" rel="noopener">Thinking in Systems · 出版信息</a>。</div></div>`;
$('article').style.setProperty('--read-size',fontSize+'px');$('note').value=store.getItem('jzw_note_'+id)||'';$('note').addEventListener('input',ev=>{store.setItem('jzw_note_'+id,ev.target.value);$('save-label').textContent='✓ 已自动保存于此浏览器'});document.title=e.title+' | 借书之问';updateReadingProgress();}
function markDone(id){if(completed.has(id))completed.delete(id);else completed.add(id);store.setItem('jzw_done',JSON.stringify([...completed]));renderSide();renderRead(id);toast(completed.has(id)?'已标记为读完':'已取消标记')}
function clearProgress(){if(!confirm('确定清除已读进度吗？私人笔记不会删除。'))return;completed.clear();store.setItem('jzw_done','[]');renderSide();route();toast('阅读进度已重置')}
function changeFont(delta){fontSize=Math.max(16,Math.min(26,fontSize+delta));store.setItem('jzw_font',fontSize);if($('article'))$('article').style.setProperty('--read-size',fontSize+'px');toast('字号 '+fontSize+'px')}
function copyLink(){let url=location.href;if(navigator.clipboard&&location.protocol==='https:'){navigator.clipboard.writeText(url).then(()=>toast('链接已复制')).catch(()=>toast('请从浏览器地址栏复制链接'))}else{toast('请从浏览器地址栏复制链接')}}
function updateReadingProgress(){if(current==='home')return;let max=document.documentElement.scrollHeight-innerHeight;let p=max>0?Math.max(0,Math.min(100,scrollY/max*100)):0;$('top-progress').style.width=p+'%'}
function route(){let m=location.hash.match(/^#\/read\/(\d{2})/);current=m?m[1]:'home';if(current==='home')renderHome();else renderRead(current);renderSide();closeMenu();window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',route);window.addEventListener('scroll',updateReadingProgress,{passive:true});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});route();</script><nav aria-label="系列导航" style="position:fixed;bottom:16px;right:16px;z-index:1000;display:flex;gap:14px;padding:10px 16px;border-radius:24px;background:#fffefa;color:#202a28;box-shadow:0 2px 16px #0002;font:13px/1.5 sans-serif"><a href="../">← 全部系列</a><a href="../antifragile/">反脆弱 ↗</a></nav></body></html>
