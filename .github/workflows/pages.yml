name: Deploy reading site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build shared reading catalog
        run: python3 scripts/build-reading-system.py
      - name: Validate reading system
        run: node --test tests/*.test.cjs
      - name: Run reproducible engineering lab
        run: |
          python3 site/downloads/agent-control-experiment.py
          python3 site/downloads/agent-reading-labs.py --all
      - name: Validate content identities and links
        run: python3 scripts/validate-reading-content.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
